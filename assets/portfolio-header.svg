<radialGradient id="glow"><stop stop-color="#62D84E" stop-opacity=".17"/><stop offset="1" stop-color="#62D84E" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" stroke="#BCE5D5" stroke-width=".6" stroke-opacity=".09" fill="none"/></pattern>
</defs>
